{% extends "website/base.html" %}

{% block titleblock %}Password Reset Complete{% endblock %}

{% block content %}
<div class="rop-page-title">
  <h1>Password Reset Complete</h1>
  <p class="rop-subtitle">Your password has been changed</p>
</div>

<div class="rop-panel">
  <div class="rop-panel__header">Success</div>
  <div class="rop-panel__body">
    <p>Your password has been successfully reset. You may now log in with your new password.</p>
    <a href="{% url 'rop-login' %}" class="rop-btn rop-btn--primary">Log In</a>
  </div>
</div>
{% endblock %}
